name: Emergency restore active config

on:
  push:
    branches: [master]
    paths:
      - 'scripts/emergency-restore-active-config.py'
      - '.github/workflows/emergency-restore-active-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply patch
        run: python3 scripts/emergency-restore-active-config.py

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: node --check api/proxy.js

      - name: Typecheck
        run: npm run typecheck

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'emergencyRestoreCompactConfig' api/proxy.js
          grep -q 'EMERGENCY_RESTORE_KEY_SHA256' api/proxy.js
          if grep -q 'f275bcb46087425015fd5d2227fabf0d8725bfbe3ce0d6e0c8db2d4b183fbbb6' api/proxy.js; then
            echo 'Raw restore key must never be committed'
            exit 1
          fi

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/proxy.js
          git commit -m 'Emergency: add one-time encrypted config restore'
          git pull --rebase origin master
          git push origin HEAD:master
