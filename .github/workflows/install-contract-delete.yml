name: Install contract delete feature

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/install-contract-delete.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: install contract delete patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch contract deletion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patch target not found: {label}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/utils/adminApi.ts',
              """export async function loadBusinessSnapshot(force = false): Promise<BusinessSnapshot> {
            const data = await adminBusinessRequest<{ snapshot: BusinessSnapshot }>('adminBusinessSnapshot', { force });
            return normalizeBusinessSnapshot(data.snapshot);
          }
          """,
              """async function loadDeletedBusinessContractIds(): Promise<string[]> {
            try {
              const config = await loadAdminConfig(activeAdminSession);
              return Array.isArray(config?.deletedContractIds)
                ? config.deletedContractIds.map((id: unknown) => String(id || '').trim()).filter(Boolean)
                : [];
            } catch (_) {
              return [];
            }
          }

          export async function loadBusinessSnapshot(force = false): Promise<BusinessSnapshot> {
            const [data, deletedContractIds] = await Promise.all([
              adminBusinessRequest<{ snapshot: BusinessSnapshot }>('adminBusinessSnapshot', { force }),
              loadDeletedBusinessContractIds(),
            ]);
            const snapshot = normalizeBusinessSnapshot(data.snapshot);
            if (!deletedContractIds.length) return snapshot;
            const deleted = new Set(deletedContractIds);
            return { ...snapshot, contracts: snapshot.contracts.filter((contract) => !deleted.has(String(contract.id))) };
          }

          export async function deleteBusinessContract(contractId: string): Promise<void> {
            const id = String(contractId || '').trim();
            if (!id) throw new Error('Contrato no identificado.');
            const deletedContractIds = await loadDeletedBusinessContractIds();
            if (!deletedContractIds.includes(id)) {
              await saveAdminConfig(
                activeAdminSession,
                { deletedContractIds: [...deletedContractIds, id] },
                'CONTRATO_ELIMINADO_PANEL',
                `Contrato ${id} eliminado del panel administrativo`,
              );
            }
            businessSnapshotCache = null;
          }
          """,
              'adminApi load/delete contracts',
          )

          replace_once(
              'src/components/BusinessAdminPanel.tsx',
              """  TrendingUp,
            Users,
          """,
              """  TrendingUp,
            Trash2,
            Users,
          """,
              'Trash2 import',
          )

          replace_once(
              'src/components/BusinessAdminPanel.tsx',
              """  createGeneratedBusinessContract,
            cacheBusinessClients,
          """,
              """  createGeneratedBusinessContract,
            deleteBusinessContract,
            cacheBusinessClients,
          """,
              'deleteBusinessContract import',
          )

          replace_once(
              'src/components/BusinessAdminPanel.tsx',
              """  const persistOwnerSignature = async () => {
          """,
              """  const removeContract = async (contract: BusinessContract) => {
            const confirmed = window.confirm(`¿Eliminar ${contract.documentType === 'COTIZACION' ? 'la cotización' : 'el contrato'} ${contract.folio || contract.id} de ${contract.clientName}?\\n\\nSe quitará del panel y dejará de aparecer en la lista. El PDF original permanecerá resguardado en Drive.`);
            if (!confirmed) return;
            setBusy(true);
            try {
              await deleteBusinessContract(contract.id);
              setSnapshot((prev) => ({ ...prev, contracts: prev.contracts.filter((item) => item.id !== contract.id) }));
              if (contractPreview?.id === contract.id) setContractPreview(null);
              setLatestLink('');
              setModalNotice('Contrato eliminado del panel. El archivo original permanece resguardado en Drive.');
            } catch (error: any) {
              setModalNotice(error?.message || 'No se pudo eliminar el contrato.');
            } finally {
              setBusy(false);
            }
          };

            const persistOwnerSignature = async () => {
          """,
              'remove contract handler',
          )

          old = """{contract.status === 'Firmado por cliente' && <button onClick={() => finalize(contract)} disabled={busy || !snapshot.ownerSignatureConfigured} className=\"inline-flex items-center gap-2 rounded-xl bg-[#D4AF37] px-3 py-2 text-xs font-bold text-black disabled:opacity-40\"><CheckCircle2 className=\"h-4 w-4\" />Autorizar y finalizar</button>}</div></div></article>"""
          new = """{contract.status === 'Firmado por cliente' && <button onClick={() => finalize(contract)} disabled={busy || !snapshot.ownerSignatureConfigured} className=\"inline-flex items-center gap-2 rounded-xl bg-[#D4AF37] px-3 py-2 text-xs font-bold text-black disabled:opacity-40\"><CheckCircle2 className=\"h-4 w-4\" />Autorizar y finalizar</button>}{session.role === 'SUPER_ADMIN' && <button onClick={() => removeContract(contract)} disabled={busy} className=\"inline-flex items-center gap-2 rounded-xl border border-red-400/30 bg-red-500/5 px-3 py-2 text-xs font-semibold text-red-300 hover:bg-red-500/10 disabled:opacity-40\"><Trash2 className=\"h-4 w-4\" />Eliminar</button>}</div></div></article>"""
          replace_once('src/components/BusinessAdminPanel.tsx', old, new, 'delete button')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/adminApi.ts src/components/BusinessAdminPanel.tsx
          git commit -m "feat(contracts): allow deleting loaded contracts"
          git push origin master
