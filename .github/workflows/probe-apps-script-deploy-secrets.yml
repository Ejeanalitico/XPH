name: Probe Apps Script deployment credentials

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/probe-apps-script-deploy-secrets.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
      CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
      CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Record presence only
        shell: bash
        run: |
          mkdir -p ops
          : > ops/apps-script-secret-presence.txt
          for name in APPS_SCRIPT_ID GAS_SCRIPT_ID SCRIPT_ID APPS_SCRIPT_DEPLOYMENT_ID CLASP_TOKEN CLASP_AUTH CLASPRC_JSON GOOGLE_SERVICE_ACCOUNT_JSON GOOGLE_APPLICATION_CREDENTIALS_JSON GOOGLE_CREDENTIALS; do
            if [ -n "${!name}" ]; then
              printf '%s=present\n' "$name" >> ops/apps-script-secret-presence.txt
            else
              printf '%s=missing\n' "$name" >> ops/apps-script-secret-presence.txt
            fi
          done
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/apps-script-secret-presence.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Ops: record Apps Script deploy credential availability'
          git push origin HEAD:master
