name: Install background activity center

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/install-background-activity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch background activity center
        run: python3 scripts/patch-background-activity.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BusinessAdminPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(admin): add non-blocking background activity center"
          git push origin master
