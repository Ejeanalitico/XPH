name: Install contract calculation fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-contract-calculation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply contract arithmetic repair
        run: python scripts/patch-contract-calculations.py
      - name: Update arithmetic invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-crm-invariants.mjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.match(businessPanel, /percentage: 40, amount: total \\* \\.4/);\nassert.match(businessPanel, /percentage: 30, amount: total \\* \\.3/);"
          new = "assert.match(businessPanel, /standardContractPayments/);\nassert.match(businessPanel, /normalizedTotal \\* 0\\.4/);\nassert.match(businessPanel, /normalizedTotal \\* 0\\.3/);\nassert.match(businessPanel, /normalizedTotal - first - second/);\nassert.match(proxy, /scheduledTotal/);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('No se encontró el invariante de pagos esperado')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify application
        run: |
          npm ci
          npm run check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BusinessAdminPanel.tsx api/proxy.js scripts/verify-crm-invariants.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix contract totals and payment arithmetic'
            git push origin master
          fi
