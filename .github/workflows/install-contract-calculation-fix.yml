name: Install contract calculation fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-contract-calculation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply contract arithmetic repair
        run: python scripts/patch-contract-calculations.py
      - name: Update contract invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-crm-invariants.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "assert.match(businessPanel, /percentage: 40, amount: total \\* \\.4/);\nassert.match(businessPanel, /percentage: 30, amount: total \\* \\.3/);": "assert.match(businessPanel, /standardContractPayments/);\nassert.match(businessPanel, /normalizedTotal \\* 0\\.4/);\nassert.match(businessPanel, /normalizedTotal \\* 0\\.3/);\nassert.match(businessPanel, /normalizedTotal - first - second/);\nassert.match(proxy, /scheduledTotal/);",
              "assert.match(contractDocument, /CONTRATO DE SERVICIOS/);": "assert.match(contractDocument, /CONTRATO DE PRESTACIÓN DE SERVICIOS FOTOGRÁFICOS Y AUDIOVISUALES/);",
              "assert.match(contractDocument, /Política 40% \\/ 30% \\/ 30%/);": "assert.match(contractDocument, /Calendario de pagos programado/);",
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'No se encontró el invariante esperado: {old}')
          path.write_text(text, encoding='utf-8')
          print('Invariantes de contrato actualizados.' if changed else 'Invariantes ya actualizados.')
          PY
      - name: Verify application
        run: |
          npm ci
          npm run check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BusinessAdminPanel.tsx api/proxy.js scripts/verify-crm-invariants.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix contract totals and payment arithmetic'
            git push origin master
          fi
