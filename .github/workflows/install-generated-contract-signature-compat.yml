name: Install generated contract signature compatibility

on:
  push:
    branches: [master]
    paths:
      - scripts/patch-generated-contract-signature-compat.py
      - .github/workflows/install-generated-contract-signature-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatibility repair
        run: python scripts/patch-generated-contract-signature-compat.py
      - name: Verify application
        run: |
          npm ci
          npm run typecheck --if-present
          npm run build
      - name: Verify generated contracts use canonical signature page
        run: |
          grep -q "const generatedContract = Boolean(contract?.documentSnapshot)" api/proxy.js
          grep -q "if (snapshot.documentType === 'CONTRATO')" api/proxy.js
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/proxy.js
          git commit -m "Keep generated contract signatures in canonical PDF"
          git push origin master
