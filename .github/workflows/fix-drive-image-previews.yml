name: Fix Google Drive image previews

on:
  push:
    paths:
      - '.github/workflows/fix-drive-image-previews.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Drive image rendering
        run: python3 .github/scripts/fix_drive_image_previews.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit production fix
        run: |
          rm -f .github/workflows/fix-drive-image-previews.yml .github/scripts/fix_drive_image_previews.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Google Drive image previews and publishing'
          git push origin master
