name: Install property storage quota fix

on:
  push:
    branches: [master]
    paths:
      - 'scripts/patch-property-storage-quota.py'
      - '.github/workflows/install-property-storage-quota-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch-property-storage-quota.py

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check api/proxy.js
          node --check google-apps-script.js

      - name: Typecheck
        run: npm run typecheck

      - name: Validate diff
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/proxy.js google-apps-script.js
          git commit -m 'Fix Apps Script property storage quota exhaustion'
          git push origin HEAD:master
