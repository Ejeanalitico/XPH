          anchor = "const money = (value: number) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(value) || 0);\n"
          helpers = r'''const clientCsvColumns: Array<[keyof CrmClient, string]> = [
