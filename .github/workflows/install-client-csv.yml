              {canCreateCurrentType && <button onClick={() => { setSelectedClientId(''); setClientDraft({ ...blankClient(), recordType: tab === 'clients' ? 'Cliente' : 'Prospecto' }); setShowClientForm(true); }} className="inline-flex items-center justify-center gap-2 rounded-xl bg-[#D4AF37] px-4 py-3 text-sm font-bold text-black"><Plus className="h-4 w-4" />{tab === 'prospects' ? 'Nuevo prospecto' : 'Nuevo cliente'}</button>}
            </div>
          </div>'''
          if new_header not in text:
              if old_header not in text:
                  raise SystemExit('client list header anchor not found')
              text = text.replace(old_header, new_header, 1)

          old_detail_actions = '<div className="flex flex-wrap gap-2">{canEditSelected && selectedClient.recordType === \'Prospecto\''
          new_detail_actions = '<div className="flex flex-wrap gap-2">{session.role === \'SUPER_ADMIN\' && selectedClient.recordType === \'Cliente\' && <button type="button" onClick={() => downloadClientCsv([selectedClient], snapshot)} className="inline-flex items-center gap-2 rounded-lg border border-emerald-300/30 bg-emerald-400/10 px-4 py-2 text-sm font-semibold text-emerald-100"><Download className="h-4 w-4" />Descargar CSV</button>}{canEditSelected && selectedClient.recordType === \'Prospecto\''
          if new_detail_actions not in text:
              if old_detail_actions not in text:
                  raise SystemExit('selected client actions anchor not found')
              text = text.replace(old_detail_actions, new_detail_actions, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BusinessAdminPanel.tsx
          git diff --cached --quiet && exit 0
