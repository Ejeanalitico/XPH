name: Install collapsed admin menu

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-admin-menu-collapsed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply collapsed menu patch
        run: python scripts/patch-admin-menu-collapsed.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/UnifiedAdminDashboard.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Open admin menu fully collapsed'
            git push origin master
          fi
